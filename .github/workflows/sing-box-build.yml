name: Build sing-box (v2ray-api)

# Builds sing-box from source with the with_v2ray_api tag so the agent's
# gRPC stats sampler has counters to read (upstream's release binaries are
# compiled without it). Cron picks up the latest upstream stable and beta
# tags daily; we only build & publish versions we have not already shipped.
#
# Artifacts land as a GitHub Release on THIS repo, tagged
# `singbox-vX.Y.Z-v2rayapi`. The Shepherd server's release fetcher resolves
# binaries from those releases (see internal/plugins/singbox/release.go).

on:
  schedule:
    # 03:00 UTC daily. Upstream usually tags in the morning UTC, so this
    # catches new stable/beta releases within ~6h. Manual dispatch overrides cron.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream sing-box tag to build (e.g. v1.14.0-beta.2). Leave empty to check the latest stable and beta.'
        required: false
      force:
        description: 'Rebuild even if our release already exists for that version.'
        type: boolean
        default: false

permissions:
  contents: write   # for release creation

jobs:
  decide:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      matrix:       ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          # 1) Pick candidates. Manual input wins. Scheduled runs check both
          #    GitHub's latest stable and the newest non-draft prerelease.
          if [[ -n "${INPUT_VERSION}" ]]; then
            candidates=$(jq -nc --arg version "${INPUT_VERSION}" '[ $version ]')
          else
            stable=$(gh api repos/SagerNet/sing-box/releases/latest --jq '.tag_name')
            beta=$(gh api 'repos/SagerNet/sing-box/releases?per_page=100' \
              --jq '[.[] | select(.draft == false and .prerelease == true)][0].tag_name // ""')
            candidates=$(jq -nc --arg stable "${stable}" --arg beta "${beta}" \
              '[ $stable, $beta ] | map(select(length > 0)) | unique')
          fi
          echo "Upstream candidates: ${candidates}"

          # 2) Build a job matrix containing only versions that are missing.
          matrix='{"include":[]}'
          while IFS= read -r version; do
            release_tag="singbox-${version}-v2rayapi"
            if [[ "${INPUT_FORCE}" != "true" ]] && \
               gh release view "${release_tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Already published: ${release_tag}"
              continue
            fi
            matrix=$(jq -c \
              --arg version "${version}" \
              --arg release_tag "${release_tag}" \
              '.include += [{version: $version, release_tag: $release_tag}]' <<< "${matrix}")
          done < <(jq -r '.[]' <<< "${candidates}")

          if [[ $(jq '.include | length' <<< "${matrix}") -gt 0 ]]; then
            should_build="true"
          else
            should_build="false"
          fi
          echo "matrix=${matrix}"
          echo "should_build=${should_build}"

          {
            echo "should_build=${should_build}"
            echo "matrix=${matrix}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.release.version }}, ${{ matrix.arch }})
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.decide.outputs.matrix).include }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout sing-box source
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ matrix.release.version }}
          path: sing-box-src

      - name: Read upstream default build tags
        id: tags
        working-directory: sing-box-src
        run: |
          # Start from upstream's DEFAULT_BUILD_TAGS, drop with_naive_outbound
          # (needs naiveproxy toolchain — too much for a daily cron), append
          # with_v2ray_api + with_grpc (the point of this whole pipeline).
          default_tags=$(cat release/DEFAULT_BUILD_TAGS)
          tags=$(echo "$default_tags" | tr ',' '\n' | grep -v -E '^(with_naive_outbound|with_cloudflared|with_usbip|with_openvpn|with_openconnect)$' | paste -sd,)
          tags="${tags},with_v2ray_api,with_grpc"
          echo "tags=${tags}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Use sing-box's pinned go.mod toolchain so we don't drift ahead
          # of what upstream tests.
          go-version-file: sing-box-src/go.mod
          cache: true
          cache-dependency-path: sing-box-src/go.sum

      - name: Build sing-box
        working-directory: sing-box-src
        env:
          BUILD_TAGS: ${{ steps.tags.outputs.tags }}
          VERSION: ${{ matrix.release.version }}
        run: |
          set -euo pipefail
          # Strip leading "v" for the Version ldflag, matching upstream's
          # calculate_version behaviour.
          ver_no_v="${VERSION#v}"
          CGO_ENABLED=0 go build \
            -v -trimpath -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${ver_no_v}' -s -w -buildid=" \
            -o ../sing-box \
            ./cmd/sing-box

      - name: Verify v2ray-api is linked in
        run: |
          # Cheap proof: the symbol "v2ray.core.app.stats.command.StatsService"
          # is set by the StatsService init() block when with_v2ray_api is
          # active. If we built without the tag, the string isn't present.
          if ! strings ./sing-box | grep -q 'v2ray.core.app.stats.command.StatsService'; then
            echo "FAIL: built binary has no v2ray-api StatsService symbol" >&2
            exit 1
          fi

      - name: Package
        env:
          VERSION: ${{ matrix.release.version }}
          ARCH:    ${{ matrix.arch }}
        run: |
          set -euo pipefail
          name="shepherd-singbox-${VERSION}-v2rayapi-linux-${ARCH}"
          mkdir -p "$name"
          mv sing-box "$name/sing-box"
          # Bundle license + a short readme so a curious operator can see
          # the build tags / commit they're running.
          cp sing-box-src/LICENSE "$name/LICENSE"
          cat > "$name/README.txt" <<EOF
          shepherd-singbox = sing-box ${VERSION} built with with_v2ray_api.
          Upstream commit: $(cd sing-box-src && git rev-parse HEAD)
          Build tags: ${{ steps.tags.outputs.tags }}
          EOF
          tar czf "${name}.tar.gz" "$name"
          # SHA256 sidecar — sha256sum format ("<hex>  <filename>\n").
          # The Shepherd server fetches this before instructing agents
          # to download the tar.gz; agents verify locally before install.
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: shepherd-singbox-${{ matrix.release.version }}-v2rayapi-linux-${{ matrix.arch }}
          path: |
            shepherd-singbox-${{ matrix.release.version }}-v2rayapi-linux-${{ matrix.arch }}.tar.gz
            shepherd-singbox-${{ matrix.release.version }}-v2rayapi-linux-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 7

  release:
    name: Publish release (${{ matrix.release.version }})
    needs: [decide, build]
    if: needs.decide.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.decide.outputs.matrix).include }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: shepherd-singbox-${{ matrix.release.version }}-v2rayapi-linux-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.release.version }}
          TAG:     ${{ matrix.release.release_tag }}
        run: |
          set -euo pipefail
          # The release is a passive artifact host (no Shepherd code
          # changes when we cut one) — short, factual body is plenty.
          release_flags=()
          if [[ "${VERSION}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "sing-box ${VERSION} + v2ray-api" \
            --notes "Auto-built from sagernet/sing-box at ${VERSION} with the with_v2ray_api build tag, plus the rest of upstream's DEFAULT_BUILD_TAGS minus with_naive_outbound. Consumed by Shepherd server's release fetcher." \
            "${release_flags[@]}" \
            artifacts/*.tar.gz \
            artifacts/*.tar.gz.sha256
